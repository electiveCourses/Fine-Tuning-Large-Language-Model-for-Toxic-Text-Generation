[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fine-tuning-llm-toxic-text"
version = "1.0.0"
description = "Fine-tuning large language models for toxic text generation research"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Research Team", email = "research@example.com"},
]
keywords = ["machine learning", "nlp", "toxic text", "fine-tuning", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "accelerate>=1.8.0",
    "datasets>=3.6.0",
    "torch>=2.0.0",
    "transformers>=4.50.0",
    "trl>=0.19.0",
    "peft>=0.15.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0.0",
    "huggingface-hub>=0.20.0",
    "tokenizers>=0.19.0",
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "ipywidgets>=8.0.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/your-username/Fine-Tuning-Large-Language-Model-for-Toxic-Text-Generation"
"Bug Tracker" = "https://github.com/your-username/Fine-Tuning-Large-Language-Model-for-Toxic-Text-Generation/issues"
Documentation = "https://github.com/your-username/Fine-Tuning-Large-Language-Model-for-Toxic-Text-Generation/docs"
Repository = "https://github.com/your-username/Fine-Tuning-Large-Language-Model-for-Toxic-Text-Generation"

[project.scripts]
download-data = "scripts.data_processing.download_data:main"
preprocess-data = "scripts.data_processing.preprocess:main"
generate-prompts = "scripts.data_processing.generate_prompts:main"
train-reward-model = "scripts.reward_model.train_reward_model:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["scripts", "scripts.data_processing", "scripts.model_training", "scripts.reward_model", "scripts.alignment", "utils"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yml", "*.yaml", "*.json"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
  | models
  | logs
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["scripts", "utils"]
skip_glob = ["data/*", "models/*", "logs/*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "data/",
    "models/",
    "logs/",
    "notebooks/",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"

python_files = [
    "test_*.py",
    "*_test.py",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["scripts", "utils"]
omit = [
    "tests/*",
    "notebooks/*",
    "data/*",
    "models/*",
    "logs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
] 